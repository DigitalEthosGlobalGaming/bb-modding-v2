name: Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One runtime per bbport version in src/scripts/tools.lock.json: adding a version there is all it takes.
  plan:
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.list.outputs.runtimes }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "runtimes=$(python3 -c "import json; print(json.dumps([r['id'] for r in json.load(open('src/scripts/tools.lock.json'))['runtimes']]))")" >> "$GITHUB_OUTPUT"

  runtime:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.runtimes) }}
    steps:
      # The runtime patches must keep LF endings or they will not apply to the LF checkout of bbport.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Each runtime takes a long time to build, so it is cached on everything that affects it.
      - name: Restore the staged runtime
        id: cache
        uses: actions/cache@v4
        with:
          path: .local/runtime-stage/${{ matrix.id }}
          key: runtime-${{ matrix.id }}-${{ hashFiles('src/scripts/tools.lock.json', 'src/scripts/build-runtime.ps1', 'src/scripts/prepare_runtime.py', 'src/integration/*.patch', 'src/host/**', 'sdk/include/**', 'sdk/rust/**') }}

      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        id: msys2
        with:
          msystem: CLANG64
          update: true

      - name: Build the runtime
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./src/scripts/build-runtime.ps1 -InstallDependencies -Runtime "${{ matrix.id }}" -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.id }}
          path: .local/runtime-stage/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: runtime
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publication audit
        run: python src/scripts/audit_publication.py

      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: runtime-artifacts

      - name: Stage the runtimes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/runtime-stage | Out-Null
          foreach ($d in Get-ChildItem runtime-artifacts -Directory) {
            Move-Item $d.FullName (Join-Path .local/runtime-stage ($d.Name -replace '^runtime-', ''))
          }
          Get-ChildItem .local/runtime-stage | ForEach-Object Name

      - name: Build installer
        shell: pwsh
        run: ./src/installer/build.ps1 -Test

      - uses: actions/upload-artifact@v4
        with:
          name: bb-modding-installer
          path: |
            src/installer/dist/bb-modding-installer.exe
            src/installer/dist/bb-modding-installer.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bb-modding-installer
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bb-modding-installer.exe
            bb-modding-installer.exe.sha256
