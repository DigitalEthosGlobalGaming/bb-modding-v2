[package]
name = "bb-modding-installer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Windows installer for the bb-modding mod loader and mod manager"
build = "build.rs"

[lib]
name = "bbinstall"
path = "src/lib.rs"

[[bin]]
name = "bb-modding-installer"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", optional = true }

[profile.release]
lto = true
opt-level = "s"
strip = true

[workspace]
