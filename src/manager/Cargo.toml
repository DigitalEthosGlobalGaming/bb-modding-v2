[package]
name = "bbmod_manager"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bbmod = { path = "../../sdk/rust/bbmod" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[profile.release]
panic = "unwind"   # the SDK catches panics at the FFI boundary; do not use "abort"
lto = true

[workspace]
